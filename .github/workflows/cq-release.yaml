name: "Publish GitHub release"
run-name: "Publishing GitHub release ${{ inputs.tag_name }}"
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The release tag version'
        required: true
        type: string
      do_draft:
        description: 'Whether to publish as a draft'
        required: true
        type: boolean
        default: true
      do_release_notes:
        description: 'Whether to generate release notes'
        required: true
        type: boolean
        default: true

  workflow_call:
    inputs:
      tag_name:
        description: 'The release tag version'
        required: true
        type: string
        default: github.ref_name
      do_draft:
        description: 'Whether to publish as a draft'
        required: true
        type: boolean
        default: true
      do_release_notes:
        description: 'Whether to generate release notes'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: Add release to GitHub
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Generate changelog
      uses: orhun/git-cliff-action@v4
      id: git-cliff
      with:
        config: .github/workflows/cliff.toml
        args: --latest --strip header
      env:
        OUTPUT: CHANGELOG.md
        GITHUB_REPO: ${{ github.repository }}

    - name: Create release
      uses: softprops/action-gh-release@v3
      with:
        name: "Release ${{ inputs.tag_name }}"
        tag: ${{ inputs.tag_name }}
        body: ${{ steps.git-cliff.outputs.content }}
        draft: ${{ inputs.do_draft }}
        generate_release_notes: ${{ inputs.do_release_notes }}