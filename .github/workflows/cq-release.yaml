name: "Publishing GitHub Release"
run-name: "Publishing release on GitHub"
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The release tag version'
        required: true
        type: string
      do_draft:
        description: 'Whether to publish as a draft'
        required: true
        type: boolean
        default: true
      do_release_notes:
        description: 'Whether to generate release notes'
        required: true
        type: boolean
        default: true

  workflow_call:
    inputs:
      tag_name:
        description: 'The release tag version'
        required: true
        type: string
        default: github.ref_name
      do_draft:
        description: 'Whether to publish as a draft'
        required: true
        type: boolean
        default: true
      do_release_notes:
        description: 'Whether to generate release notes'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    name: "Add release to GitHub"
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: "Install dependencies"
      run: |
        python -m pip install --upgrade pip
    - name: "Checkout repository"
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: "Create release draft"
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.tag_name }}
        draft: ${{ inputs.do_draft }}
        generate_release_notes: ${{ inputs.do_release_notes }}
        name: "Release ${{ inputs.tag_name }}"